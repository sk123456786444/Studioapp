name: Build ZeroFeed TikTok APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          # Automatically accept Android SDK licenses
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea3c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a648b0" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> /usr/local/lib/android/sdk/licenses/android-sdk-license

      - name: Build with Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease bundleRelease
          else
            echo "Gradlew not found, searching directory..."
            find . -name "gradlew"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroFeed-TikTok-App
          path: |
            **/*.apk
            **/*.aab
            
